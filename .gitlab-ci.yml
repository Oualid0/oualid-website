# Node 22 LTS – matches "engines" in package.json (^20.19 || ^22.12 || ^24)
default:
  image: node:22
  # Cache node_modules + npm's download cache, keyed on the lockfile so it is
  # only rebuilt when dependencies actually change.
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - node_modules/
  before_script:
    # npm ci = clean, reproducible install straight from package-lock.json
    - npm ci --cache .npm --prefer-offline

stages:
  - test
  - deploy

lint:
  stage: test
  script:
    - npm run lint
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

test:
  stage: test
  # node:22 has no browser – install Chromium for headless Karma.
  variables:
    CHROME_BIN: /usr/bin/chromium
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends chromium
    - npm ci --cache .npm --prefer-offline
  script:
    - npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox
  coverage: '/Statements\s+:\s+(\d+(?:\.\d+)?)%/'
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

pages:
  stage: deploy
  script:
    - npm run build -- --configuration production
    - mv dist/oualid-o-website/browser public
  artifacts:
    paths:
      - public
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
