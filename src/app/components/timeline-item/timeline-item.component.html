<li class="ms-4 relative">
    <div *ngIf="data">

        <!-- POINT -->
        <div class="absolute w-2.5 h-2.5 rounded-full mt-2 -start-[1.35rem] border-2 border-background"
            [ngClass]="data.ongoing ? 'bg-primary' : 'bg-outline'"
            [ngStyle]="data.ongoing ? {'box-shadow': '0 0 8px var(--primary-glow)'} : {}"></div>

        <!-- CARD -->
        <div [class]="cardClasses()">

            <!-- TITLE -->
            <h3 class="text-base font-semibold text-on-surface">{{data.name}}</h3>

            <!-- META: TAG + DATE -->
            <div class="flex flex-wrap items-center gap-x-3 gap-y-2 mt-3">
                <!-- Letter-spacing also trails the last glyph, so the right padding is reduced by the same amount to keep the label centered. -->
                <span class="inline-flex items-center gap-1.5 h-5 rounded-full border pl-2 pr-[calc(0.5rem-0.05em)] font-cons text-[10px] leading-none uppercase tracking-wider"
                    [ngClass]="isCustomerProject() ? 'border-primary/50 bg-primary/10 text-primary font-semibold' : 'border-outline-variant text-on-surface-variant'">
                    <span *ngIf="isCustomerProject()" class="w-1.5 h-1.5 rounded-full bg-primary" aria-hidden="true"></span>
                    {{tagLabel()}}
                </span>

                <span class="font-cons text-xs leading-none text-on-surface-variant">
                    <ng-container *ngIf="data.ongoing; else notOngoing">{{data.dateStart}} — {{text()['ongoingLabel']}}</ng-container>
                    <ng-template #notOngoing>
                        <ng-container *ngIf="data.dateEnd; else singleDate">{{data.dateStart}} — {{data.dateEnd}}</ng-container>
                        <ng-template #singleDate>{{data.dateStart}}</ng-template>
                    </ng-template>
                    <ng-container *ngIf="duration()"> · {{duration()}}</ng-container>
                </span>
            </div>

            <!-- DESCRIPTION -->
            <p *ngIf="data.description" class="text-sm text-on-surface leading-relaxed mt-4 line-breaks">
                {{data.description}}
            </p>

            <!-- TECH -->
            <div *ngIf="data.tech?.length" class="mt-4">
                <span class="block font-cons text-xs tracking-wide text-on-surface-variant">{{text()['tech']}}</span>
                <ul class="flex flex-wrap gap-1.5 mt-2">
                    <li *ngFor="let t of data.tech"
                        class="font-cons text-xs text-on-surface-variant border border-outline-variant rounded px-2 py-0.5">
                        {{t}}
                    </li>
                </ul>
            </div>

            <!-- LINK -->
            <p *ngIf="data.link" class="mt-4">
                <a class="text-primary text-sm hover:underline" target="_blank" [href]="data.link">↗ {{data.linkName}}</a>
            </p>
        </div>
    </div>

    <!--IF DATA DOES NOT EXITS-->
    <div *ngIf="!data">
        <h1 class="text-error">PROJECT DATA IS MISSING!</h1>
    </div>
</li>
