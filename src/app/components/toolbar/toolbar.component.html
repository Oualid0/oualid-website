<div class="fixed top-0 left-0 w-full z-50 flex justify-center px-4 pt-4">
    <div
        class="w-[clamp(21rem,88vw,75rem)] flex justify-between items-center pl-5 pr-2 py-2 rounded-full bg-surface-container/40 backdrop-blur-md border border-outline-variant text-on-surface font-medium">
        <h1 class="text-base font-semibold">Oualid O.</h1>
        <div class="flex items-center gap-2">
            <button (click)="toggleLanguage()" [attr.aria-label]="'Sprache wechseln, aktuell ' + language()"
                class="glow-hover flex items-center gap-1.5 h-9 px-3 rounded-full bg-surface-container-high border border-outline-variant text-on-surface-variant font-cons text-xs tracking-wide active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7"
                    stroke="currentColor" class="w-4 h-4 text-primary">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M3 12h18" />
                    <path d="M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18" />
                </svg>
                {{language()}}
            </button>
            <button (click)="toggleDarkMode()"
                [attr.aria-label]="darkMode() ? 'Zu hellem Modus wechseln' : 'Zu dunklem Modus wechseln'"
                class="glow-hover flex items-center justify-center h-9 w-9 rounded-full bg-surface-container-high border border-outline-variant text-on-surface-variant active:scale-95">
                <svg *ngIf="darkMode()" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke-width="1.7" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
                </svg>
                <svg *ngIf="!darkMode()" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke-width="1.7" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
                </svg>
            </button>
        </div>
    </div>
</div>
