<div class="fixed top-0 left-0 w-full z-50">
    <div class="p-2 md:w-9/12 mx-auto toolbar" [ngClass]="{'hidden-toolbar': isHidden}">
        <div
            class="bg-gray-200 dark:bg-gray-900 bg-opacity-95 dark:bg-opacity-95 flex justify-between items-center text-gray-900 rounded-lg shadow-lg font-medium capitalize">
            <div class="flex-shrink-0">
                <h1 class="dark:text-white text-2xl ml-3">Oualid O.</h1>
            </div>
            <div class="flex flex-shrink-0">
                <span>
                    <button (click)="toggleLanguage()"
                        class="bg-cyan-200  text-black dark:bg-cyan-800 hover:bg-cyan-400 dark:hover:bg-cyan-600 dark:text-white active:scale-95 rounded-full h-10 w-10 m-2">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="w-6 h-6 m-auto">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="m10.5 21 5.25-11.25L21 21m-9-3h7.5M3 5.621a48.474 48.474 0 0 1 6-.371m0 0c1.12 0 2.233.038 3.334.114M9 5.25V3m3.334 2.364C11.176 10.658 7.69 15.08 3 17.502m9.334-12.138c.896.061 1.785.147 2.666.257m-4.589 8.495a18.023 18.023 0 0 1-3.827-5.802" />
                        </svg>
                    </button>
                    <button
                        class="bg-cyan-200 text-black dark:bg-cyan-800 hover:bg-cyan-400 dark:hover:bg-cyan-600 dark:text-white active:scale-95 rounded-full h-10 w-10 m-2"
                        (click)="toggleDarkMode()">
                        <svg *ngIf="darkMode" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke-width="1.5" stroke="currentColor" class="w-6 h-6 m-auto">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
                        </svg>
                        <svg *ngIf="!darkMode" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke-width="1.5" stroke="currentColor" class="w-6 h-6 m-auto">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
                        </svg>
                    </button>
                </span>
            </div>
        </div>
    </div>
</div>
