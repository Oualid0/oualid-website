<div class="w-full bg-black text-white h-fit flex">
    <p class="m-2 mr-0 text-sm">{{appYear}} | {{appVersion}} | {{appAuthor}} |</p>

    <p class="m-2 ml-0 text-sm cursor-pointer text-blue-400 hover:text-blue-300 font-semibold" (click)="toggleImprint()"
        (keyup.enter)="toggleImprint()" tabindex="0">
        &nbsp;{{text['imprint']}}
    </p>
</div>

<!-- Popup for imprint -->
<div class="fixed inset-0 flex justify-center items-center p-10 z-50" style="background-color: rgba(0, 0, 0, 0.3);"
    *ngIf="isImprintVisible">
    <div class="bg-white dark:bg-gray-900 bg-opacity-80 rounded-lg shadow-lg max-w-2xl w-full opacity-100 p-4">
        <!-- Scrollable Content -->
        <div class="p-4 overflow-y-auto max-h-96 rounded-md">
            <app-imprint></app-imprint>
        </div>
        <!-- Always Visible Close Button -->
        <div class="p-4 rounded-b-lg">
            <button class="bg-cyan-100 text-black dark:bg-cyan-900 dark:text-white hover:bg-cyan-200 dark:hover:bg-cyan-800
            active:scale-95 rounded-md px-4 py-2" (click)="toggleImprint()">{{text['close']}}</button>
        </div>
    </div>
</div>
