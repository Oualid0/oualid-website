<div class="w-full bg-surface-container-lowest border-t border-outline-variant text-on-surface-variant flex font-cons text-xs">
    <p class="m-3 mr-0">v{{appVersion}} · {{appYear}} · {{appAuthor}} ·</p>

    <button type="button" class="m-3 ml-1 cursor-pointer text-primary hover:underline font-medium font-cons text-xs tracking-wide focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary rounded" (click)="toggleImprint()">
        {{text()['imprint']}}
    </button>
</div>

<!-- Popup for imprint -->
<div class="fixed inset-0 flex justify-center items-center p-6 z-50 bg-black/40 backdrop-blur-sm"
    *ngIf="isImprintVisible()">
    <div class="relative bg-surface-container-high border border-outline-variant rounded-lg shadow-lg max-w-lg w-full p-6">
        <button class="glow-hover absolute top-3 right-3 flex items-center justify-center w-8 h-8 rounded-full border border-outline-variant text-on-surface-variant active:scale-95"
            (click)="toggleImprint()" [attr.aria-label]="text()['close']">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" class="w-4 h-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
        </button>
        <div class="overflow-y-auto max-h-96 pr-2">
            <app-imprint></app-imprint>
        </div>
    </div>
</div>
