<div class="pt-28 pb-20 -mt-28" id="contact">
    <h2 class="dark:text-white text-3xl font-bold mb-5">{{text()['title']}}</h2>

    <!-- Under Construction Message -->
    <p class="dark:text-white text-sm">{{text()['errorMsg1']}}</p>

    <!-- Disabled Contact Form -->
    <form class="flex flex-col opacity-50 cursor-not-allowed">
        <input type="text" name="name" placeholder="{{text()['inputName']}}"
            class="bg-gray-50 border border-gray-300 text-gray-900 dark:bg-gray-600 dark:border-gray-400 dark:text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 m-2"
            disabled>
        <input type="email" name="email" placeholder="{{text()['inputEmail']}}"
            class="bg-gray-50 border border-gray-300 text-gray-900 dark:bg-gray-600 dark:border-gray-400 dark:text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 m-2"
            disabled>
        <textarea name="message" placeholder="{{text()['inputMsg']}}"
            class="bg-gray-50 border border-gray-300 text-gray-900 dark:bg-gray-600 dark:border-gray-400 dark:text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 m-2 h-28"
            disabled></textarea>
        <button type="submit" class="bg-cyan-100 text-black dark:bg-cyan-900 dark:text-white hover:bg-cyan-200 dark:hover:bg-cyan-800 
        active:scale-95 rounded-md px-4 py-2 w-40 self-center" disabled>{{text()['send']}}</button>
    </form>

    <br>
</div>
