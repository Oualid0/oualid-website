<app-section-title [label]="title()"></app-section-title>

<div class="flex flex-wrap gap-2.5">
    <div *ngFor="let item of technologies()"
        class="glow-hover flex items-center gap-2 rounded-md border border-outline-variant bg-surface-container-high px-3 py-2">
        <span class="w-1.5 h-1.5 rounded-full bg-primary" style="box-shadow: 0 0 8px var(--primary-glow);" aria-hidden="true"></span>
        <span class="font-cons text-xs text-on-surface">{{item.name}}</span>
        <span class="font-cons text-[10px] text-on-surface-variant">{{item.level}}</span>
    </div>
</div>
